name: Sync Database with Broker

on:
  workflow_dispatch:  # Manual trigger only

env:
  PYTHON_VERSION: "3.8"

jobs:
  sync-database:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Download previous database
      continue-on-error: true
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        echo "=== Downloading latest trading-database artifact ==="
        ARTIFACT_ID=$(gh api repos/${{ github.repository }}/actions/artifacts \
          --jq '.artifacts | map(select(.name == "trading-database" and .expired == false)) | sort_by(.created_at) | reverse | .[0].id // empty')
        
        if [ -n "$ARTIFACT_ID" ]; then
          echo "Found artifact ID: $ARTIFACT_ID"
          gh api repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID/zip > trading-db.zip
          unzip -o trading-db.zip
          rm -f trading-db.zip
          echo "✅ Downloaded trading.db from artifact $ARTIFACT_ID"
          ls -la trading.db
        else
          echo "⚠️ No trading-database artifact found — will initialize fresh"
        fi
    
    - name: Initialize database if needed
      run: |
        python scripts/setup_database.py --db trading.db
    
    - name: Sync broker state to database
      env:
        ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
        ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        ALPACA_PAPER: true
      run: |
        echo "🔄 Syncing database with broker state..."
        python scripts/sync_broker_state.py
        echo "✅ Database synced successfully"
    
    - name: Upload synced database
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: trading-database
        path: trading.db
        retention-days: 90
        overwrite: true
    
    - name: Summary
      if: always()
      run: |
        echo "## Database Sync Complete" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "✅ Database has been synced with broker state" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "The next daily trading run should pass reconciliation." >> $GITHUB_STEP_SUMMARY
