name: Dependency Updates

on:
  schedule:
    # Run weekly on Monday at 9 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  update-dependencies:
    name: Check for Dependency Updates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      
      - name: Install pip-tools
        run: pip install pip-tools
      
      - name: Check for outdated packages
        run: |
          pip list --outdated > outdated-packages.txt
          cat outdated-packages.txt
      
      - name: Run safety check
        run: |
          pip install safety
          safety check --json --output safety-report.json || true
      
      - name: Create issue if vulnerabilities found
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            
            // Check if safety report exists
            if (fs.existsSync('safety-report.json')) {
              const report = JSON.parse(fs.readFileSync('safety-report.json', 'utf8'));
              
              if (report.vulnerabilities && report.vulnerabilities.length > 0) {
                const vulns = report.vulnerabilities;
                const body = `## 🔒 Security Vulnerabilities Detected\n\n` +
                  `Found ${vulns.length} vulnerabilities in dependencies:\n\n` +
                  vulns.map(v => `- **${v.package}** ${v.installed_version}: ${v.vulnerability}`).join('\n') +
                  `\n\n**Action Required:** Update dependencies to fix these vulnerabilities.`;
                
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: '🔒 Security: Dependency Vulnerabilities Detected',
                  body: body,
                  labels: ['security', 'dependencies']
                });
              }
            }
      
      - name: Upload reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-reports
          path: |
            outdated-packages.txt
            safety-report.json
          retention-days: 30
