name: Daily Performance Monitoring

on:
  schedule:
    # Run at 5:00 PM EST (22:00 UTC) - 45 minutes after trading execution
    - cron: '0 22 * * 1-5'
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.8"

jobs:
  monitor-performance:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Download database
      uses: actions/download-artifact@v4
      with:
        name: trading-database
        path: .
      continue-on-error: true
    
    - name: Run performance checks
      id: checks
      run: |
        python3 << 'EOF'
        import sqlite3
        import json
        from datetime import datetime, timedelta
        
        # Connect to database
        conn = sqlite3.connect('trading.db')
        cursor = conn.cursor()
        
        # Initialize results
        results = {
            'date': datetime.now().strftime('%Y-%m-%d'),
            'checks': {},
            'failures': []
        }
        
        # Check 1: Signals generated today
        cursor.execute("""
            SELECT strategy_id, COUNT(*) as signal_count
            FROM signals
            WHERE DATE(generated_at) = DATE('now')
            GROUP BY strategy_id
        """)
        signals_today = cursor.fetchall()
        total_signals = sum([s[1] for s in signals_today])
        
        results['checks']['signals_generated'] = {
            'value': total_signals,
            'status': 'PASS' if total_signals >= 1 else 'FAIL',
            'details': f"{total_signals} signals generated today"
        }
        
        if total_signals < 1:
            results['failures'].append(f"⚠️ Only {total_signals} signals generated (expected ≥1)")
        
        # Check 2: Trades executed today
        cursor.execute("""
            SELECT COUNT(*) as trade_count
            FROM trades
            WHERE DATE(executed_at) = DATE('now')
        """)
        trades_today = cursor.fetchone()[0]
        
        results['checks']['trades_executed'] = {
            'value': trades_today,
            'status': 'PASS' if trades_today >= 0 else 'FAIL',
            'details': f"{trades_today} trades executed today"
        }
        
        # Check 3: Portfolio utilization
        cursor.execute("""
            SELECT COUNT(*) as position_count
            FROM positions
            WHERE shares > 0
        """)
        open_positions = cursor.fetchone()[0]
        
        utilization_pct = (open_positions / 15) * 100  # 15 is max positions
        
        results['checks']['portfolio_utilization'] = {
            'value': f"{open_positions}/15 ({utilization_pct:.1f}%)",
            'status': 'PASS',
            'details': f"{open_positions} open positions"
        }
        
        if utilization_pct < 10:
            results['failures'].append(f"⚠️ Low utilization: {utilization_pct:.1f}% (only {open_positions} positions)")
        
        # Check 4: Strategy performance (last 7 days)
        cursor.execute("""
            SELECT 
                s.name,
                COUNT(DISTINCT sig.id) as signals,
                COUNT(DISTINCT t.id) as trades
            FROM strategies s
            LEFT JOIN signals sig ON s.id = sig.strategy_id 
                AND sig.generated_at >= DATE('now', '-7 days')
            LEFT JOIN trades t ON s.id = t.strategy_id 
                AND t.executed_at >= DATE('now', '-7 days')
            WHERE s.status = 'active'
            GROUP BY s.id, s.name
        """)
        strategy_stats = cursor.fetchall()
        
        silent_strategies = []
        for name, signals, trades in strategy_stats:
            if signals == 0 and name not in ['News Sentiment']:  # Exclude disabled strategies
                silent_strategies.append(name)
        
        results['checks']['silent_strategies'] = {
            'value': len(silent_strategies),
            'status': 'WARN' if len(silent_strategies) > 2 else 'PASS',
            'details': f"{len(silent_strategies)} strategies with 0 signals in 7 days: {', '.join(silent_strategies) if silent_strategies else 'None'}"
        }
        
        if len(silent_strategies) > 2:
            results['failures'].append(f"⚠️ {len(silent_strategies)} strategies silent for 7 days: {', '.join(silent_strategies)}")
        
        # Check 5: Data freshness
        cursor.execute("""
            SELECT value FROM system_state WHERE key = 'last_data_update'
        """)
        last_update = cursor.fetchone()
        
        if last_update:
            from datetime import datetime
            last_update_time = datetime.fromisoformat(last_update[0])
            hours_old = (datetime.now() - last_update_time).total_seconds() / 3600
            
            results['checks']['data_freshness'] = {
                'value': f"{hours_old:.1f} hours old",
                'status': 'PASS' if hours_old < 48 else 'FAIL',
                'details': f"Last update: {last_update_time.strftime('%Y-%m-%d %H:%M')}"
            }
            
            if hours_old > 48:
                results['failures'].append(f"❌ Data is {hours_old:.1f} hours old (>48h)")
        
        conn.close()
        
        # Write results to file
        with open('monitoring_results.json', 'w') as f:
            json.dump(results, f, indent=2)
        
        # Set output for email using environment file
        import os
        with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
            f.write(f"total_failures={len(results['failures'])}\n")
            f.write(f"signals={total_signals}\n")
            f.write(f"trades={trades_today}\n")
            f.write(f"positions={open_positions}\n")
        
        # Print summary
        print("\n" + "="*80)
        print("DAILY MONITORING SUMMARY")
        print("="*80)
        for check_name, check_data in results['checks'].items():
            status_icon = "✅" if check_data['status'] == 'PASS' else "⚠️" if check_data['status'] == 'WARN' else "❌"
            print(f"{status_icon} {check_name}: {check_data['details']}")
        
        if results['failures']:
            print("\n⚠️ FAILURES DETECTED:")
            for failure in results['failures']:
                print(f"  {failure}")
        else:
            print("\n✅ ALL CHECKS PASSED")
        
        EOF
    
    - name: Send success email
      if: steps.checks.outputs.total_failures == '0'
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 587
        username: ${{ secrets.EMAIL_USERNAME }}
        password: ${{ secrets.EMAIL_PASSWORD }}
        subject: "✅ Daily Trading Monitoring - All Checks Passed - ${{ github.run_number }}"
        to: ${{ secrets.ALERT_EMAIL }}
        from: Trading System Monitor
        body: |
          Daily Trading Monitoring Report
          Date: ${{ steps.checks.outputs.date }}
          
          ✅ ALL CHECKS PASSED
          
          Summary:
          - Signals Generated: ${{ steps.checks.outputs.signals }}
          - Trades Executed: ${{ steps.checks.outputs.trades }}
          - Open Positions: ${{ steps.checks.outputs.positions }}/15
          
          System Status: HEALTHY
          
          View full run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    
    - name: Send failure alert email
      if: steps.checks.outputs.total_failures != '0'
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 587
        username: ${{ secrets.EMAIL_USERNAME }}
        password: ${{ secrets.EMAIL_PASSWORD }}
        subject: "❌ ALERT: Daily Trading Monitoring Failed - ${{ github.run_number }}"
        to: ${{ secrets.ALERT_EMAIL }}
        from: Trading System Monitor
        priority: high
        body: |
          ⚠️ TRADING SYSTEM ALERT ⚠️
          
          Date: ${{ steps.checks.outputs.date }}
          Failures Detected: ${{ steps.checks.outputs.total_failures }}
          
          Summary:
          - Signals Generated: ${{ steps.checks.outputs.signals }}
          - Trades Executed: ${{ steps.checks.outputs.trades }}
          - Open Positions: ${{ steps.checks.outputs.positions }}/15
          
          ⚠️ ACTION REQUIRED: Review the monitoring results
          
          View full details: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          
          This is an automated alert from your trading system monitoring.
    
    - name: Upload monitoring results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: monitoring-results-${{ github.run_number }}
        path: monitoring_results.json
        retention-days: 30
