name: Daily Trading Execution

on:
  # PRIMARY trigger is cron-job.org firing at 05:45 UTC via workflow_dispatch.
  # GitHub's native cron is unreliable as a primary (fires 1-4h late) and once
  # produced duplicate runs/emails (2026-05-28). It is re-enabled below as a
  # BACKUP only: it fires 2h after the primary, and the precheck job skips the
  # whole run when a dispatched run already succeeded (or is running) today —
  # so a missed cron-job.org dispatch no longer silently skips a trading day.
  schedule:
    - cron: '45 7 * * 1-5'  # backup, 07:45 UTC Mon-Fri (still pre-market)
  workflow_dispatch:  # Triggered by cron-job.org (and available for manual runs)

# Prevent two trading runs from overlapping — concurrent runs would download the
# same DB artifact, execute trades independently, and race to upload the result,
# with the last upload winning and the other run's changes silently lost.
concurrency:
  group: daily-trading-execution
  cancel-in-progress: false  # never cancel a run mid-trade; queue instead

env:
  PYTHON_VERSION: "3.11"
  # SINGLE staleness threshold — used by the freshness alert, the pre-trading
  # gate, and run_trading.sh's data validator. 80h covers a normal weekend
  # (Fri close -> Mon 05:45 UTC ≈ 57h); holiday gaps are handled by the
  # last-completed-session check in the pre-trading gate, not by widening this.
  DATA_MAX_AGE_HOURS: "80"

jobs:
  # Backup-trigger gate: when fired by the native cron (backup), skip the run
  # entirely if cron-job.org's dispatched run already succeeded or is still
  # in flight today. workflow_dispatch always proceeds.
  precheck:
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.gate.outputs.proceed }}
    steps:
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TODAY=$(date -u +%F)
          N=$(gh api "repos/${{ github.repository }}/actions/workflows/daily_trading.yml/runs?per_page=15" \
            --jq "[.workflow_runs[] | select(.event==\"workflow_dispatch\"
                   and (.created_at|startswith(\"$TODAY\"))
                   and (.conclusion==\"success\" or .status==\"in_progress\" or .status==\"queued\"))] | length")
          if [ "$N" -gt 0 ]; then
            echo "Primary (dispatched) run already succeeded/running today — backup skipping"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "No successful dispatched run today — backup trigger proceeding"
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

  daily-execution:
    needs: precheck
    if: needs.precheck.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required for gh release create (DB backup)

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Set runtime date
      id: runtime_date
      run: echo "today=$(date +%Y-%m-%d)" >> $GITHUB_OUTPUT

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Import check
      run: |
        python3 scripts/import_check.py

    - name: Download previous database (if exists)
      id: download_db
      continue-on-error: true
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        echo "=== Downloading latest trading-database artifact ==="
        # Server-side name filter: the unfiltered endpoint returns only the
        # first 30 artifacts and CI churn can push trading-database off page 1
        ARTIFACT_ID=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=trading-database&per_page=100" \
          --jq '.artifacts | map(select(.expired == false)) | sort_by(.created_at) | reverse | .[0].id // empty')

        if [ -n "$ARTIFACT_ID" ]; then
          echo "Found artifact ID: $ARTIFACT_ID"
          gh api repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID/zip > trading-db.zip
          unzip -o trading-db.zip
          rm -f trading-db.zip
          echo "✅ Downloaded trading.db from artifact $ARTIFACT_ID"
          ls -la trading.db
          if ! sqlite3 trading.db "SELECT name FROM sqlite_master WHERE type='table' AND name='broker_state';" | grep -q broker_state; then
            echo "⚠️ trading.db artifact missing broker_state table — removing to force clean init"
            rm -f trading.db
            echo "cold_start=true" >> $GITHUB_OUTPUT
          else
            echo "cold_start=false" >> $GITHUB_OUTPUT
          fi
        else
          echo "⚠️ No trading-database artifact found — will initialize fresh"
          echo "cold_start=true" >> $GITHUB_OUTPUT
        fi

    - name: Initialize database
      run: |
        python scripts/setup_database.py --db trading.db

    - name: Verify database initialized
      run: |
        if [ ! -f trading.db ]; then
          echo "❌ trading.db missing after initialization"
          exit 1
        fi
        if ! sqlite3 trading.db "SELECT name FROM sqlite_master WHERE type='table' AND name='broker_state';" | grep -q broker_state; then
          echo "❌ broker_state table missing in trading.db"
          exit 1
        fi

    - name: Create required directories
      run: |
        mkdir -p artifacts/json artifacts/markdown artifacts/funnel artifacts/data_quality artifacts/drawdown artifacts/health artifacts/diagnostics logs data

    - name: Pre-execution broker sync
      continue-on-error: true
      env:
        ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
        ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        ALPACA_PAPER: 'true'
      run: |
        # Runs every session (not just cold start) to clear phantom positions from
        # prior-run OPG orders that were assumed-filled in paper mode but expired
        # unfilled at the open.  Without this, ghost positions accumulate each run
        # and cause the reconciliation gate to fail before any trading happens.
        if [ "${{ steps.download_db.outputs.cold_start }}" = "true" ]; then
          echo "=== Cold start — pre-syncing broker positions into fresh DB ==="
        else
          echo "=== Warm start — clearing unfilled OPG phantom positions ==="
        fi
        python scripts/sync_broker_state.py && echo "✅ Pre-sync complete" || echo "⚠️ Pre-sync failed (broker may have no positions)"

    - name: Download previous training data (if exists)
      continue-on-error: true
      env:
        GH_TOKEN: ${{ github.token }}
        ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
        ALPHA_VANTAGE_PREMIUM: ${{ secrets.ALPHA_VANTAGE_PREMIUM }}
      run: |
        echo "=== Downloading latest training-data artifact ==="
        ARTIFACT_ID=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=training-data&per_page=100" \
          --jq '.artifacts | map(select(.expired == false)) | sort_by(.created_at) | reverse | .[0].id // empty')
        if [ -n "$ARTIFACT_ID" ]; then
          echo "Found artifact ID: $ARTIFACT_ID"
          gh api repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID/zip > training-data.zip
          unzip -o training-data.zip -d data/
          rm -f training-data.zip
          ROWS=$(wc -l < data/training_data.csv 2>/dev/null || echo "0")
          echo "Downloaded training_data.csv ($ROWS rows)"
          # Need at least 36 symbols × 200 days = 7200 rows for 200-day MA
          if [ "$ROWS" -lt "7200" ]; then
            echo "⚠️ Insufficient data ($ROWS rows < 7200 required) — running full historical fetch"
            rm -f data/training_data.csv
            python3 scripts/fetch_historical_data.py
          else
            echo "✅ Training data sufficient ($ROWS rows)"
          fi
        else
          echo "⚠️ No training-data artifact found — will fetch full history"
          python3 scripts/fetch_historical_data.py
        fi

    - name: Download previous earnings calendar (if exists)
      continue-on-error: true
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        echo "=== Downloading earnings calendar artifact ==="
        ARTIFACT_ID=$(gh api repos/${{ github.repository }}/actions/artifacts \
          --jq '.artifacts | map(select(.name == "earnings-calendar" and .expired == false)) | sort_by(.created_at) | reverse | .[0].id // empty')
        if [ -n "$ARTIFACT_ID" ]; then
          gh api repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID/zip > earnings-cal.zip
          unzip -o earnings-cal.zip -d data/
          rm -f earnings-cal.zip
          echo "✅ Restored earnings calendar from artifact"
        else
          echo "⚠️ No earnings calendar artifact found — will fetch fresh"
        fi

    - name: Download ML model (if exists)
      continue-on-error: true
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        echo "=== Downloading ML model artifact ==="
        ARTIFACT_ID=$(gh api repos/${{ github.repository }}/actions/artifacts \
          --jq '.artifacts | map(select(.name == "ml-model" and .expired == false)) | sort_by(.created_at) | reverse | .[0].id // empty')
        if [ -n "$ARTIFACT_ID" ]; then
          gh api repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID/zip > ml-model.zip
          unzip -o ml-model.zip -d data/
          rm -f ml-model.zip
          echo "✅ Restored ML model from artifact"
          ls -lh data/ml_model.pkl
        else
          echo "⚠️ No ML model artifact found — will train fresh"
        fi

    - name: Update market data
      id: update_market_data
      continue-on-error: true
      env:
        ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
        # Premium pacing (1s/req vs 12s) — without it the expanded universe
        # takes ~25 min per fetch attempt
        ALPHA_VANTAGE_PREMIUM: ${{ secrets.ALPHA_VANTAGE_PREMIUM }}
      run: |
        echo "=== Fetching Latest Market Data ==="
        for attempt in 1 2 3; do
          echo "Attempt $attempt/3..."
          python3 scripts/update_daily_data.py && break
          if [ "$attempt" -lt 3 ]; then
            sleep $((attempt * 20))
          fi
        done || echo "⚠️  Market data update failed after 3 attempts — pre-flight will enforce staleness threshold"

    - name: Check data freshness and alert if stale
      if: always()
      continue-on-error: true
      env:
        SENDER_EMAIL: ${{ secrets.EMAIL_USERNAME }}
        SENDER_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        RECIPIENT_EMAIL: ${{ secrets.EMAIL_TO }}
      run: |
        python3 - <<'PY'
        import os
        import sys
        from pathlib import Path
        from datetime import datetime, timedelta

        data_file = Path("data/training_data.csv")
        if not data_file.exists():
            print("⚠️ training_data.csv not found — first run or cold start")
            sys.exit(0)

        age_hours = (datetime.now() - datetime.fromtimestamp(data_file.stat().st_mtime)).total_seconds() / 3600
        threshold = int(os.environ.get("DATA_MAX_AGE_HOURS", "80"))

        if age_hours <= threshold:
            print(f"✅ Market data is fresh ({age_hours:.1f}h old)")
            sys.exit(0)

        print(f"⚠️ Market data is STALE: {age_hours:.0f}h old (threshold {threshold}h)")
        try:
            from src.utils.email_notifier import EmailNotifier, build_alert_html, _kv_rows
            body = (
                _kv_rows([
                    ("Data age", f"{age_hours:.0f} hours"),
                    ("Threshold", f"{threshold} hours"),
                    ("File", str(data_file)),
                    ("Action needed", "Check Alpha Vantage API key and quota"),
                ])
                + "<p style='color:#555;font-size:13px;margin:12px 0 0'>"
                "Trading will proceed with stale data. Signals may be based on outdated prices.</p>"
            )
            html = build_alert_html("⚠️ Market Data Stale", body, accent_color="#e65100")
            notifier = EmailNotifier()
            notifier.send_alert("⚠️ Market Data Stale — Action Needed", html)
            print("Alert email sent")
        except Exception as e:
            print(f"Could not send alert: {e}")
        PY

    - name: Update earnings calendar
      continue-on-error: true
      env:
        ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
      run: |
        echo "=== Updating Earnings Calendar ==="
        python3 scripts/update_earnings_calendar.py || echo "Earnings calendar update skipped (API key missing or AV error)"

    - name: Upload earnings calendar
      if: always()
      continue-on-error: true
      uses: actions/upload-artifact@v4
      with:
        name: earnings-calendar
        path: data/earnings_calendar.csv
        retention-days: 90
        overwrite: true

    - name: Update fundamental data (weekly, Mondays only)
      continue-on-error: true
      env:
        ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
      run: |
        DAY=$(date +%u)
        if [ "$DAY" = "1" ]; then
          echo "=== Updating Fundamental Data (Monday refresh) ==="
          python3 scripts/update_fundamental_data.py || echo "Fundamental data update skipped (API key missing or AV error)"
        else
          echo "=== Skipping fundamental update (runs Mondays only, today is day $DAY) ==="
        fi

    - name: Check signal generation health
      env:
        ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
      run: |
        echo "=== Signal Generation Health Check ==="
        python3 scripts/monitor_signal_health.py || echo "Health check completed with warnings"

    - name: Pre-trading health gate
      env:
        ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
        ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      run: |
        echo "=== Pre-trading health gate ==="
        python3 - <<'PY'
        import sys, os
        from pathlib import Path
        from datetime import datetime, timedelta

        failures = []

        # 1. DB exists and has required tables
        if not Path("trading.db").exists():
            failures.append("❌ trading.db missing")
        else:
            import sqlite3
            with sqlite3.connect("trading.db", timeout=10) as c:
                tables = {r[0] for r in c.execute(
                    "SELECT name FROM sqlite_master WHERE type='table'"
                ).fetchall()}
            for t in ["trades", "positions", "order_intents", "broker_state"]:
                if t not in tables:
                    failures.append(f"❌ DB table missing: {t}")

        # 2. Market data is reasonably fresh (single DATA_MAX_AGE_HOURS knob;
        #    holiday gaps pass via the last-completed-session calendar check)
        data_file = Path("data/training_data.csv")
        if not data_file.exists():
            failures.append("❌ training_data.csv missing")
        else:
            from src.validation.data_freshness import is_fresh
            mtime = datetime.fromtimestamp(data_file.stat().st_mtime)
            fresh, reason = is_fresh(mtime)
            if not fresh:
                failures.append(f"⚠️  Market data stale: {reason} (soft warning — trading continues)")

        # 3. Required env vars / secrets present
        for var in ["ALPACA_API_KEY", "ALPACA_SECRET_KEY"]:
            if not os.getenv(var, ""):
                failures.append(f"❌ Secret missing: {var}")

        hard_failures = [f for f in failures if f.startswith("❌")]
        for msg in failures:
            print(msg)

        if hard_failures:
            print(f"\n{len(hard_failures)} hard failure(s) — aborting trading run")
            sys.exit(1)
        print("✅ Pre-trading health gate passed")
        PY

    - name: Run trading with pre-flight checks
      env:
        ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
        ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
        ALPACA_PAPER: 'true'
        ALPACA_LIVE_ENABLED: 'false'
        DRY_RUN: 'false'
        ENABLE_BROKER_RECONCILIATION: 'true'
        # DATA_MAX_AGE_HOURS inherits the single workflow-level knob
        TRADING_DISABLED: 'false'
      run: |
        chmod +x scripts/run_trading.sh
        ./scripts/run_trading.sh

    - name: Check if trading executed
      id: check_execution
      if: always()
      run: |
        if [ -f /tmp/run_status.txt ]; then
          STATUS=$(cat /tmp/run_status.txt)
          if [ "$STATUS" = "SUCCESS" ] || [ "$STATUS" = "EXECUTING" ]; then
            echo "executed=true" >> $GITHUB_OUTPUT
          else
            echo "executed=false" >> $GITHUB_OUTPUT
          fi
        else
          echo "executed=false" >> $GITHUB_OUTPUT
        fi

    - name: Post-run liveness and funnel guardrails
      id: guardrails
      if: always() && steps.check_execution.outputs.executed == 'true'
      run: |
        echo "=== Post-run Guardrails ==="
        python3 scripts/diagnostics/post_run_guardrails.py \
          --db trading.db \
          --status-file /tmp/run_status.txt \
          --out artifacts/diagnostics/post_run_guardrails.json

    - name: Post-run expectation check
      id: expect_check
      if: always()
      continue-on-error: true  # outcome feeds the final health gate; alerts go via outbox
      run: |
        echo "=== Post-run Expectation Check ==="
        python3 scripts/post_run_expect.py \
          --db trading.db \
          --out artifacts/diagnostics/expect_check.json
        echo "Exit code: $?"

    # Runs AFTER the expectation check so alerts it queues (and anything the
    # engine queued during trading) are delivered in this same run.
    - name: Process notification outbox
      if: always()
      env:
        SMTP_SERVER: smtp.gmail.com
        SMTP_PORT: 587
        SENDER_EMAIL: ${{ secrets.EMAIL_USERNAME }}
        SENDER_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        RECIPIENT_EMAIL: ${{ secrets.EMAIL_TO }}
      run: |
        python3 scripts/process_notification_outbox.py --db trading.db --limit 100

    - name: Paper trading validation report
      if: always()
      continue-on-error: true
      run: |
        echo "=== Paper Trading Validation Report ==="
        python3 scripts/paper_trading_report.py --days 30 || echo "Report skipped (DB not yet populated)"

    - name: Check reconciliation status
      id: check_reconciliation
      if: always()
      continue-on-error: true
      run: |
        echo "=== Checking Reconciliation from Database ==="

        # Query database directly for reconciliation status
        RUN_ID=$(sqlite3 trading.db "SELECT run_id FROM broker_state WHERE snapshot_type != 'SYNC' AND run_id != 'AUTO_SYNC' ORDER BY created_at DESC LIMIT 1;" || echo "UNKNOWN")
        RECON_STATUS=$(sqlite3 trading.db "SELECT reconciliation_status FROM broker_state WHERE run_id='$RUN_ID' AND snapshot_type IN ('RECONCILIATION', 'RECONCILIATION_RETRY') ORDER BY created_at DESC, id DESC LIMIT 1;" || echo "UNKNOWN")

        echo "Run ID: $RUN_ID"
        echo "Reconciliation Status: $RECON_STATUS"

        # Set outputs for downstream steps
        echo "status=$RECON_STATUS" >> $GITHUB_OUTPUT

        if [ "$RECON_STATUS" = "FAIL" ]; then
          echo "discrepancies=1" >> $GITHUB_OUTPUT
          echo "⚠️  Reconciliation FAILED - will trigger auto-sync"
        else
          echo "discrepancies=0" >> $GITHUB_OUTPUT
          echo "✅ Reconciliation status: $RECON_STATUS"
        fi

        # Ensure outputs are set even on edge cases
        echo "recon_done=true" >> $GITHUB_OUTPUT

    - name: Auto-sync database on reconciliation failure
      id: auto_sync
      if: always() && steps.check_reconciliation.outputs.status == 'FAIL' && steps.check_reconciliation.outputs.discrepancies != '0'
      env:
        ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
        ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        ALPACA_PAPER: true
      run: |
        echo "🔄 Reconciliation failed - Auto-syncing database with broker..."
        if python scripts/sync_broker_state.py; then
          echo "✅ Database auto-synced successfully"
          echo "synced=true"  >> $GITHUB_OUTPUT
          echo "sync_ok=true" >> $GITHUB_OUTPUT
        else
          echo "❌ Auto-sync FAILED — manual intervention needed"
          echo "synced=true"   >> $GITHUB_OUTPUT
          echo "sync_ok=false" >> $GITHUB_OUTPUT
        fi

    - name: Verify reconciliation after auto-sync
      id: verify_sync
      if: always() && steps.auto_sync.outputs.synced == 'true'
      env:
        ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
        ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        ALPACA_PAPER: true
      continue-on-error: true
      run: |
        echo "=== Re-verifying reconciliation post-sync ==="
        python3 - <<'PY'
        import json, sys, sqlite3
        from src.risk.broker_reconciler import BrokerReconciler
        r = BrokerReconciler()
        broker = r.get_broker_state()
        con = sqlite3.connect('trading.db'); con.row_factory = sqlite3.Row
        rows = con.execute(
            "SELECT symbol, SUM(shares) qty FROM positions "
            "WHERE shares != 0 GROUP BY symbol"
        ).fetchall()
        local = {r['symbol']: {'qty': float(r['qty']), 'avg_price': 0.0} for r in rows}
        ok, disc = r.reconcile_daily(local, float(broker.get('cash', 0)))
        print(json.dumps({'ok': ok, 'discrepancies': disc}, indent=2))
        with open('verify_sync.json', 'w') as f:
            json.dump({'ok': ok, 'discrepancies': disc}, f)
        sys.exit(0 if ok else 1)
        PY
        if [ -f verify_sync.json ]; then
          RESOLVED=$(python3 -c "import json; print('true' if json.load(open('verify_sync.json'))['ok'] else 'false')")
          echo "resolved=$RESOLVED" >> $GITHUB_OUTPUT
          DISC_COUNT=$(python3 -c "import json; print(len(json.load(open('verify_sync.json'))['discrepancies']))")
          echo "remaining=$DISC_COUNT" >> $GITHUB_OUTPUT
        else
          echo "resolved=false" >> $GITHUB_OUTPUT
          echo "remaining=0"    >> $GITHUB_OUTPUT
        fi

    # ── RUN HEALTH: single source of truth ─────────────────────────────────
    # Consolidates status file + expectations + guardrails + reconciliation
    # into artifacts/run_health.json AND a run_history DB row (so the row is
    # captured by BOTH database upload paths below). Detects checks that
    # failed >=3 consecutive runs and escalates them into email subjects.
    - name: Build run health report
      id: run_health
      if: always()
      continue-on-error: true  # overall verdict re-checked by the final gate
      env:
        RECON_STATUS: ${{ steps.check_reconciliation.outputs.status }}
        DRIFT_RESOLVED: ${{ steps.verify_sync.outputs.resolved }}
      run: |
        python3 scripts/diagnostics/build_run_health.py \
          --db trading.db \
          --status-file /tmp/run_status.txt \
          --expectations artifacts/diagnostics/expect_check.json \
          --guardrails artifacts/diagnostics/post_run_guardrails.json \
          --recon-status "${RECON_STATUS:-}" \
          --drift-resolved "${DRIFT_RESOLVED:-}" \
          --out artifacts/run_health.json

    - name: Upload run health artifact
      if: always()
      continue-on-error: true
      uses: actions/upload-artifact@v4
      with:
        name: run-health
        path: artifacts/run_health.json
        retention-days: 90
        overwrite: true

    - name: Checkpoint WAL before re-upload (post auto-sync)
      if: always() && steps.auto_sync.outputs.synced == 'true'
      run: |
        if ! sqlite3 trading.db "PRAGMA wal_checkpoint(TRUNCATE);"; then
          echo "⚠️ WARNING: WAL checkpoint failed after auto-sync"
        fi

    - name: Re-upload synced database
      if: always() && steps.auto_sync.outputs.synced == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: trading-database
        path: trading.db
        retention-days: 90
        overwrite: true

    # ── DASHBOARD SNAPSHOT EXPORT ──────────────────────────────────────────
    # Runs after reconciliation/auto-sync (whose step outputs it reads — placing
    # it any earlier would always yield RECON_STATUS=UNKNOWN) and before the
    # email. Writes latest.json (read-only, no secrets) then commits it to the
    # `data` branch so the Vercel site can fetch it via ISR without exposing
    # any broker credentials.
    - name: Export dashboard snapshot
      id: export_snapshot
      if: always() && steps.check_execution.outputs.executed == 'true'
      continue-on-error: true  # outcome feeds the final health gate
      env:
        GITHUB_RUN_NUMBER: ${{ github.run_number }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        RECON_STATUS: ${{ steps.check_reconciliation.outputs.status }}
        SYNC_OK: ${{ steps.auto_sync.outputs.sync_ok }}
        DRIFT_RESOLVED: ${{ steps.verify_sync.outputs.resolved }}
        DRIFT_REMAINING: ${{ steps.verify_sync.outputs.remaining }}
      run: |
        mkdir -p web/public/data/history
        python3 scripts/export_snapshot.py \
          --recon-status "${RECON_STATUS:-UNKNOWN}" \
          --sync-ok "${SYNC_OK:-}" \
          --drift-resolved "${DRIFT_RESOLVED:-}" \
          --drift-remaining "${DRIFT_REMAINING:-0}" \
          --gh-repo "$GITHUB_REPOSITORY"

    - name: Validate snapshot schema
      id: validate_snapshot
      if: always() && steps.check_execution.outputs.executed == 'true'
      continue-on-error: true  # outcome feeds the final health gate
      run: |
        python3 scripts/validate_snapshot.py

    - name: Publish snapshot to data branch
      id: publish_snapshot
      if: always() && hashFiles('web/public/data/latest.json') != ''
      continue-on-error: true  # outcome feeds the final health gate
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        # Bot-commit latest.json (and history/<date>.json) to the `data` branch.
        # Vercel reads the raw GitHub URL of this branch with ISR revalidate: 3600.
        # Nothing secret ever reaches the public URL — just a read-only JSON file.
        git config user.name  "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

        TRADING_DATE=$(python3 -c "
        import json, sys
        d = json.load(open('web/public/data/latest.json'))
        print(d['meta']['tradingDate'])
        " 2>/dev/null || echo "unknown")

        # Use a git worktree so we don't disturb the main checkout
        WORK=$(mktemp -d)
        if git fetch origin data 2>/dev/null; then
          git worktree add "$WORK" origin/data 2>/dev/null || git worktree add -b data "$WORK" origin/data
        else
          # First time: create orphan data branch
          git worktree add --orphan -b data "$WORK"
        fi

        mkdir -p "$WORK/web/public/data/history"
        cp web/public/data/latest.json "$WORK/web/public/data/latest.json"
        cp web/public/data/latest.json "$WORK/web/public/data/history/${TRADING_DATE}.json"

        cd "$WORK"
        git add web/public/data/latest.json "web/public/data/history/${TRADING_DATE}.json"
        if git diff --staged --quiet; then
          echo "No snapshot changes to commit (trading_date=${TRADING_DATE})"
        else
          git commit -m "snapshot: ${TRADING_DATE} [skip ci]"
          git push origin HEAD:data
          echo "✅ Snapshot committed to data branch (trading_date=${TRADING_DATE})"
        fi
        git worktree remove --force "$WORK"

    - name: Back up database to data branch
      id: backup_db
      if: always() && hashFiles('trading.db') != ''
      continue-on-error: true  # outcome feeds the final health gate
      run: |
        # The trading-database artifact (90-day retention) is otherwise the
        # ONLY copy of all state — a quiet period or retention change loses
        # everything. A plain-text SQL dump is committed daily: git's delta
        # compression makes append-mostly dumps nearly free, and history
        # keeps every prior day. Restore: sqlite3 new.db < db/trading.sql
        git config user.name  "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        sqlite3 trading.db "PRAGMA wal_checkpoint(TRUNCATE);" || true

        WORK=$(mktemp -d)
        if git fetch origin data 2>/dev/null; then
          git worktree add "$WORK" origin/data
        else
          git worktree add --orphan -b data "$WORK"
        fi

        mkdir -p "$WORK/db"
        sqlite3 trading.db .dump > "$WORK/db/trading.sql"

        cd "$WORK"
        git add db/trading.sql
        if git diff --staged --quiet; then
          echo "No DB changes to back up"
        else
          git commit -m "db backup: $(date -u +%F) [skip ci]"
          git push origin HEAD:data
          echo "✅ Database backed up to data branch ($(wc -c < db/trading.sql) bytes)"
        fi
        cd - > /dev/null
        git worktree remove --force "$WORK"

    - name: Validate system invariants
      if: steps.check_execution.outputs.executed == 'true'
      continue-on-error: true
      run: |
        echo "=== Validating System ==="
        python3 scripts/validate_system.py --latest

    - name: Verify execution criteria
      if: steps.check_execution.outputs.executed == 'true'
      continue-on-error: true
      run: |
        echo "=== Verifying Execution ==="
        python3 scripts/verify_execution.py

    - name: Extract run metrics
      if: always()
      run: |
        echo "=== Run Metrics ==="
        RUN_ID=$(sqlite3 trading.db "SELECT run_id FROM broker_state WHERE snapshot_type != 'SYNC' AND run_id != 'AUTO_SYNC' ORDER BY created_at DESC LIMIT 1;" || echo "UNKNOWN")
        echo "Run ID: $RUN_ID"

        if [ "$RUN_ID" != "UNKNOWN" ]; then
          echo ""
          echo "Broker Snapshots:"
          sqlite3 trading.db "SELECT snapshot_type, reconciliation_status FROM broker_state WHERE run_id='$RUN_ID' ORDER BY created_at;"

          echo ""
          echo "Signal Termination:"
          sqlite3 trading.db "SELECT COUNT(*) AS total, SUM(CASE WHEN terminal_state IS NOT NULL THEN 1 ELSE 0 END) AS terminalized FROM signals WHERE run_id='$RUN_ID';"

          echo ""
          echo "Terminal States:"
          sqlite3 trading.db "SELECT terminal_state, terminal_reason, COUNT(*) FROM signals WHERE run_id='$RUN_ID' GROUP BY terminal_state, terminal_reason;"

          echo ""
          echo "Trades:"
          sqlite3 trading.db "SELECT COUNT(*) FROM trades WHERE run_id='$RUN_ID';"
        fi

    - name: Checkpoint WAL and upload trading database
      if: always() && steps.auto_sync.outputs.synced != 'true'
      run: |
        # Force SQLite WAL checkpoint so all writes are in the main .db file before
        # uploading.  Without this, uncheckpointed WAL frames (e.g. from the inline
        # auto-sync that deleted ghost positions) are lost when only trading.db is
        # captured — the next run would restore the pre-deletion state and trigger
        # another reconciliation failure.
        if ! sqlite3 trading.db "PRAGMA wal_checkpoint(TRUNCATE);"; then
          echo "⚠️ WARNING: WAL checkpoint failed — uploaded DB may be missing recent writes"
        fi
    - name: Upload trading database
      if: always() && steps.auto_sync.outputs.synced != 'true'
      uses: actions/upload-artifact@v4
      with:
        name: trading-database
        path: trading.db
        retention-days: 90
        overwrite: true

    - name: Upload training data
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: training-data
        path: data/training_data.csv
        retention-days: 90
        overwrite: true

    - name: Upload ML model
      if: always()
      continue-on-error: true
      uses: actions/upload-artifact@v4
      with:
        name: ml-model
        path: data/ml_model.pkl
        retention-days: 14
        overwrite: true

    - name: Generate platform status report
      if: always()
      continue-on-error: true
      env:
        RUN_NUMBER: ${{ github.run_number }}
        DB_PATH: trading.db
      run: |
        echo "=== Platform Status Report ==="
        python3 scripts/generate_platform_status.py

    - name: Run per-strategy backtest (Mondays only)
      if: always()
      continue-on-error: true
      run: |
        DAY=$(date +%u)
        if [ "$DAY" = "1" ]; then
          echo "=== Per-Strategy Walk-Forward Backtest (Monday refresh) ==="
          if [ -f data/training_data.csv ]; then
            python3 scripts/run_backtest.py --per-strategy --years 3 || echo "Per-strategy backtest failed"
          else
            echo "⚠️ No training data available — skipping per-strategy backtest"
          fi
        else
          echo "=== Skipping per-strategy backtest (runs Mondays only, today is day $DAY) ==="
        fi

    - name: Walk-forward OOS validation summary
      if: always()
      continue-on-error: true
      run: |
        # Surface per-strategy OOS backtest results in GITHUB_STEP_SUMMARY
        # so they are visible on the Actions run page without downloading artifacts.
        python3 - <<'PY'
        import os, sqlite3
        from pathlib import Path

        summary = os.environ.get("GITHUB_STEP_SUMMARY", "")
        if not summary:
            raise SystemExit(0)

        db = Path("trading.db")
        if not db.exists():
            raise SystemExit(0)

        with sqlite3.connect(str(db), timeout=10) as conn:
            conn.row_factory = sqlite3.Row
            rows = conn.execute("""
                SELECT strategy_name,
                       COUNT(*) AS trades,
                       ROUND(100.0 * SUM(CASE WHEN gross_pnl > 0 THEN 1 ELSE 0 END) / COUNT(*), 1) AS win_rate,
                       ROUND(SUM(gross_pnl), 2) AS total_pnl,
                       ROUND(AVG(gross_pnl_pct) * 100, 2) AS avg_return_pct
                FROM trade_pnl_detail
                GROUP BY strategy_name
                ORDER BY total_pnl DESC
            """).fetchall()

        with open(summary, "a") as f:
            f.write("## Strategy P&L (all live paper trades)\n")
            f.write("| Strategy | Trades | Win % | Total P&L | Avg Return |\n")
            f.write("|----------|--------|-------|-----------|------------|\n")
            for r in rows:
                f.write(
                    f"| {r['strategy_name']} | {r['trades']} | {r['win_rate']}% "
                    f"| ${r['total_pnl']:,.2f} | {r['avg_return_pct']}% |\n"
                )
            if not rows:
                f.write("_No closed trades yet._\n")
        PY

    - name: Generate strategy performance report
      if: always() && steps.check_execution.outputs.executed == 'true'
      continue-on-error: true
      run: |
        python3 scripts/generate_strategy_performance.py --days 30

    - name: Generate strategy performance chart
      if: always() && steps.check_execution.outputs.executed == 'true'
      continue-on-error: true
      run: |
        python3 scripts/generate_strategy_chart.py --days 7

    - name: Generate performance chart
      if: always() && steps.check_execution.outputs.executed == 'true'
      continue-on-error: true
      run: |
        python3 scripts/generate_email_chart.py

    - name: Run live performance tracker
      if: always()
      continue-on-error: true
      run: |
        python3 scripts/performance_tracker.py --db trading.db

    - name: Snapshot trading database
      if: always()
      run: |
        mkdir -p artifacts/db_snapshots
        SNAPSHOT_NAME="trading_db_$(date +%Y%m%d).db"
        if [ -f trading.db ]; then
          cp trading.db "artifacts/db_snapshots/$SNAPSHOT_NAME"
          echo "✅ Saved DB snapshot to artifacts/db_snapshots/$SNAPSHOT_NAME"
        else
          echo "⚠️ trading.db not found; skipping DB snapshot"
        fi

    - name: Off-artifact DB backup to GitHub Releases
      if: always() && hashFiles('trading.db') != ''
      continue-on-error: true
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        # Upload trading.db to a rolling GitHub Release so it survives beyond the
        # 90-day artifact window and is recoverable even if the artifact is deleted.
        # Uses a date-stamped tag; releases older than 30 days are pruned to stay tidy.
        TAG="db-backup-$(date +%Y%m%d)"
        NOTES="Automated daily backup — $(date +%Y-%m-%d). Paper trading state only."

        # Prune backups older than 30 days (keep last 30 tags)
        gh release list --limit 100 --json tagName \
          --jq '.[] | select(.tagName | startswith("db-backup-")) | .tagName' \
          | tail -n +31 | xargs -I{} gh release delete {} --yes 2>/dev/null || true

        if gh release view "$TAG" &>/dev/null 2>&1; then
          gh release upload "$TAG" trading.db --clobber
          echo "✅ Updated existing DB backup release $TAG"
        else
          gh release create "$TAG" trading.db \
            --title "DB Backup $(date +%Y-%m-%d)" \
            --notes "$NOTES" \
            --prerelease
          echo "✅ Created new DB backup release $TAG"
        fi

    - name: Optional-step failure summary
      if: always()
      run: |
        # Report which optional (continue-on-error) steps produced warnings so they
        # appear in the GitHub Actions run summary even though they don't fail the job.
        WARNINGS=()
        [ "${{ steps.update_market_data.outcome }}" = "failure" ] && \
          WARNINGS+=("❌ Market data update failed (3 attempts)")
        [ ! -f data/earnings_calendar.csv ] && \
          WARNINGS+=("⚠️ Earnings calendar missing")
        [ ! -f data/ml_model.pkl ] && \
          WARNINGS+=("⚠️ ML model missing — will retrain from scratch")
        [ ! -f data/training_data.csv ] && \
          WARNINGS+=("❌ Training data missing")

        if [ ${#WARNINGS[@]} -eq 0 ]; then
          echo "✅ All optional steps completed successfully" >> $GITHUB_STEP_SUMMARY
        else
          echo "## ⚠️ Optional Step Warnings" >> $GITHUB_STEP_SUMMARY
          for w in "${WARNINGS[@]}"; do
            echo "- $w" >> $GITHUB_STEP_SUMMARY
          done
        fi

    - name: Upload artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: daily-artifacts-${{ github.run_number }}
        path: |
          artifacts/
          logs/
        retention-days: 90

    - name: Validate email inputs
      id: validate_email
      if: always()
      run: |
        if [ ! -f trading.db ]; then
          echo "email_ok=false" >> $GITHUB_OUTPUT
          echo "reason=missing_db" >> $GITHUB_OUTPUT
          exit 0
        fi
        BROKER_ROWS=$(sqlite3 trading.db "SELECT COUNT(*) FROM broker_state;" 2>/dev/null || echo "0")
        if [ "$BROKER_ROWS" -eq "0" ]; then
          echo "email_ok=false" >> $GITHUB_OUTPUT
          echo "reason=missing_broker_state" >> $GITHUB_OUTPUT
          exit 0
        fi
        echo "email_ok=true" >> $GITHUB_OUTPUT

    - name: Generate daily email digest
      if: always() && steps.validate_email.outputs.email_ok == 'true'
      env:
        # Optional: enables LLM-summarized "why it matters" lines in the
        # news digest. If unset, the email gracefully falls back to a
        # heuristic summary built from headlines + position context.
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        NEWS_SUMMARY_MODEL: gpt-4o-mini
        # Workflow health context for the system health card in the email
        RECON_STATUS: ${{ steps.check_reconciliation.outputs.status }}
        AUTO_SYNC_OK: ${{ steps.auto_sync.outputs.sync_ok }}
        DRIFT_RESOLVED: ${{ steps.verify_sync.outputs.resolved }}
        DRIFT_REMAINING: ${{ steps.verify_sync.outputs.remaining }}
        RUN_NUMBER: ${{ github.run_number }}
      run: |
        # Check if today is Mon/Wed/Fri for visual reports
        DAY_OF_WEEK=$(date +%u)  # 1=Mon, 3=Wed, 5=Fri
        if [ "$DAY_OF_WEEK" = "1" ] || [ "$DAY_OF_WEEK" = "3" ] || [ "$DAY_OF_WEEK" = "5" ]; then
          echo "📊 Generating email with strategy performance visuals (Mon/Wed/Fri)"
          python3 scripts/generate_daily_email.py --include-visuals || python3 scripts/generate_daily_email.py
        else
          echo "📧 Generating standard daily email"
          python3 scripts/generate_daily_email.py
        fi
        # Fallback: ensure email HTML exists so the send step never crashes on a missing file
        if [ ! -f /tmp/daily_email.html ]; then
          echo "Email generation failed — writing minimal fallback HTML"
          python3 -c "import datetime; open('/tmp/daily_email.html','w').write('<html><body style=\"font-family:sans-serif;padding:24px\"><h2>Daily Trading Digest &mdash; generation failed</h2><p>Email generation script failed. Check workflow logs.</p><p>Date: '+datetime.date.today().isoformat()+'</p></body></html>')"
        fi

    - name: Generate fallback email digest (missing data)
      if: always() && steps.validate_email.outputs.email_ok != 'true'
      run: |
        echo "⚠️ Missing broker_state data; generating warning email"
        python3 - <<'PY'
        import datetime
        reason = "${{ steps.validate_email.outputs.reason }}"
        note = "Missing trading.db" if reason == "missing_db" else "broker_state table empty"
        html = f"""<html><body style='font-family:sans-serif;padding:24px'>
        <h2>Daily Trading Digest — data missing</h2>
        <p>Trading database data was missing for today’s run ({note}).</p>
        <p>Please check the Daily Trading Execution logs for database initialization or artifact download errors.</p>
        <p>Date: {datetime.date.today().isoformat()}</p>
        </body></html>"""
        with open('/tmp/daily_email.html','w') as f:
            f.write(html)
        print("✅ Fallback email HTML generated: /tmp/daily_email.html")
        PY

    - name: Send daily digest email
      if: always()
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 587
        username: ${{ secrets.EMAIL_USERNAME }}
        password: ${{ secrets.EMAIL_PASSWORD }}
        subject: "${{ steps.run_health.outputs.recurring == 'true' && format('🔁 [RECURRING: {0}] ', steps.run_health.outputs.recurring_checks) || '' }}📊 Daily Trading Digest - ${{ steps.runtime_date.outputs.today }}"
        to: ${{ secrets.EMAIL_TO }}
        from: Trading System
        html_body: file:///tmp/daily_email.html

    - name: Create GitHub summary
      if: always()
      run: |
        RUN_ID=$(sqlite3 trading.db "SELECT run_id FROM broker_state WHERE snapshot_type != 'SYNC' AND run_id != 'AUTO_SYNC' ORDER BY created_at DESC LIMIT 1;" || echo "UNKNOWN")
        SIGNALS=$(sqlite3 trading.db "SELECT COUNT(*) FROM signals WHERE run_id='$RUN_ID';" || echo "0")
        TRADES=$(sqlite3 trading.db "SELECT COUNT(*) FROM trades WHERE run_id='$RUN_ID';" || echo "0")
        RECON_STATUS=$(sqlite3 trading.db "SELECT reconciliation_status FROM broker_state WHERE run_id='$RUN_ID' AND snapshot_type IN ('RECONCILIATION', 'RECONCILIATION_RETRY') ORDER BY created_at DESC, id DESC LIMIT 1;" || echo "UNKNOWN")

        cat > $GITHUB_STEP_SUMMARY << EOF
        # Daily Trading Execution - $(date +%Y-%m-%d)

        **Run ID:** \`$RUN_ID\`
        **Signals:** $SIGNALS
        **Trades:** $TRADES
        **Reconciliation:** $RECON_STATUS
        **Status:** ${{ job.status }}

        ## Validation Checks
        - ✅ Safety: Paper trading mode verified
        - ✅ System Invariants: Validated
        - ✅ Execution Criteria: Verified
        - ✅ Database: Uploaded (90 day retention)
        - ✅ Artifacts: Uploaded (90 day retention)

        ## Environment
        - ALPACA_PAPER: true
        - PHASE5_SIGNAL_INJECTION: false
        - ENABLE_BROKER_RECONCILIATION: true
        - DATA_MAX_AGE_HOURS: ${DATA_MAX_AGE_HOURS}

        ## Artifacts
        - Database: \`trading-database\`
        - Daily artifacts: \`daily-artifacts-${{ github.run_number }}\`
        EOF

    - name: Check run status
      id: check_status
      if: always()
      run: |
        if [ -f /tmp/run_status.txt ]; then
          STATUS=$(cat /tmp/run_status.txt)
          echo "status=$STATUS" >> $GITHUB_OUTPUT
        else
          echo "status=UNKNOWN" >> $GITHUB_OUTPUT
        fi

    - name: Final health gate
      id: final_gate
      if: always()
      continue-on-error: true  # outcome drives the failure email + job status below
      run: |
        STATUS="${{ steps.check_status.outputs.status }}"
        RECON="${{ steps.check_reconciliation.outputs.status }}"

        if [ "$STATUS" = "MARKET_CLOSED" ]; then
          echo "✅ Health gate: market closed is expected"
          exit 0
        fi

        # Allow-list, not deny-list: only SUCCESS may proceed past this point.
        #   UNKNOWN  = run_trading.sh never ran (status file missing)
        #   STARTED  = it crashed before pre-flight finished
        #   EXECUTING= the engine crashed mid-run without writing a final status
        # All of those previously slipped through a deny-list of two values.
        if [ "$STATUS" != "SUCCESS" ]; then
          echo "❌ Health gate failed: run status is '$STATUS' (only SUCCESS or MARKET_CLOSED pass)"
          exit 1
        fi

        # If reconciliation failed but auto-sync resolved it, treat as healthy.
        # Only fail the gate if drift remained after the post-sync verification.
        RESOLVED="${{ steps.verify_sync.outputs.resolved }}"
        if [ "$RECON" = "FAIL" ] && [ "$RESOLVED" != "true" ]; then
          echo "❌ Health gate failed: reconciliation drift remains after auto-sync"
          exit 1
        elif [ "$RECON" = "FAIL" ]; then
          echo "✅ Health gate: reconciliation drift was auto-resolved"
        fi

        if [ -f artifacts/diagnostics/post_run_guardrails.json ]; then
          python3 -c "import json; from pathlib import Path; p=Path('artifacts/diagnostics/post_run_guardrails.json'); report=json.loads(p.read_text()); crit=report.get('critical_failures', []); [print('❌ Health gate failed: guardrail critical failures detected')] if crit else [print('✅ Health gate: guardrails clean')]; [print(' -', item) for item in crit]; (__import__('sys').exit(1) if crit else None)"
        else
          echo "⚠️ Guardrail report missing; treating as failure"
          exit 1
        fi

        # Diagnostic/publishing steps run with continue-on-error so the DB
        # upload and email always happen — but their failures must not pass
        # silently. Any failed outcome below fails the gate (and the
        # failure-notification email fires).
        FAILED_STEPS=""
        [ "${{ steps.expect_check.outcome }}" = "failure" ]          && FAILED_STEPS="$FAILED_STEPS expect_check"
        [ "${{ steps.check_reconciliation.outcome }}" = "failure" ] && FAILED_STEPS="$FAILED_STEPS check_reconciliation"
        [ "${{ steps.export_snapshot.outcome }}" = "failure" ]      && FAILED_STEPS="$FAILED_STEPS export_snapshot"
        [ "${{ steps.validate_snapshot.outcome }}" = "failure" ]    && FAILED_STEPS="$FAILED_STEPS validate_snapshot"
        [ "${{ steps.publish_snapshot.outcome }}" = "failure" ]     && FAILED_STEPS="$FAILED_STEPS publish_snapshot"
        [ "${{ steps.backup_db.outcome }}" = "failure" ]            && FAILED_STEPS="$FAILED_STEPS backup_db"
        [ "${{ steps.run_health.outcome }}" = "failure" ]           && FAILED_STEPS="$FAILED_STEPS run_health"
        if [ -n "$FAILED_STEPS" ]; then
          echo "❌ Health gate failed: non-blocking step(s) failed:$FAILED_STEPS"
          exit 1
        fi

        # Consolidated verdict: run_health.json is the single source of truth
        # (RED = a critical check failed; YELLOW passes but is reported).
        OVERALL="${{ steps.run_health.outputs.overall }}"
        if [ "$OVERALL" = "RED" ]; then
          echo "❌ Health gate failed: run_health overall=RED (see run-health artifact)"
          exit 1
        elif [ "$OVERALL" = "YELLOW" ]; then
          echo "🟡 Health gate: run_health overall=YELLOW — passing, but check the digest"
        fi

        echo "✅ Final health gate passed"

    - name: Send market closed notification
      if: always() && steps.check_status.outputs.status == 'MARKET_CLOSED'
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 587
        username: ${{ secrets.EMAIL_USERNAME }}
        password: ${{ secrets.EMAIL_PASSWORD }}
        subject: "⏸️ Trading Skipped - Market Closed (Expected) - ${{ steps.runtime_date.outputs.today }}"
        to: ${{ secrets.EMAIL_TO }}
        from: Trading System
        html_body: |
          <!DOCTYPE html><html><body style="margin:0;padding:0;background:#f5f5f0;
              font-family:-apple-system,'Helvetica Neue',Arial,sans-serif;color:#111;">
          <div style="max-width:520px;margin:0 auto;padding:32px 24px;">
            <div style="font-size:11px;font-weight:700;letter-spacing:0.2em;color:#9a9a9a;
                        text-transform:uppercase;margin-bottom:10px;">
              ${{ steps.runtime_date.outputs.today }} · Market Status
            </div>
            <div style="font-size:24px;font-weight:800;letter-spacing:-0.02em;
                        color:#111;line-height:1.25;margin-bottom:14px;">
              Market closed — trading skipped.
            </div>
            <div style="display:inline-block;background:#e8f5e9;border:1px solid #66bb6a;
                        color:#1b5e20;font-size:11px;font-weight:700;letter-spacing:0.15em;
                        padding:4px 10px;border-radius:6px;margin-bottom:18px;">
              EXPECTED · NO ACTION NEEDED
            </div>
            <p style="font-size:14px;line-height:1.6;color:#333;margin:0 0 16px;">
              The trading system automatically skips execution on weekends and
              market holidays. No orders were placed.
            </p>
            <div style="background:#fff;border:1px solid #e0e0d8;border-radius:12px;
                        padding:14px 18px;margin-bottom:18px;">
              <table style="border-collapse:collapse;width:100%;font-size:13px;color:#333">
                <tr><td style="padding:4px 0;color:#888;width:90px">Run</td>
                    <td style="padding:4px 0">#${{ github.run_number }}</td></tr>
                <tr><td style="padding:4px 0;color:#888">Date</td>
                    <td style="padding:4px 0">${{ steps.runtime_date.outputs.today }}</td></tr>
                <tr><td style="padding:4px 0;color:#888">Next run</td>
                    <td style="padding:4px 0">Monday–Friday at 4:15 PM ET</td></tr>
              </table>
            </div>
          </div>
          </body></html>

    # Only escalate to the user when auto-sync did NOT resolve the drift.
    # If sync succeeded and the post-sync verification passes, stay silent
    # — the daily summary email already shows reconciliation status.
    - name: Send reconciliation warning
      if: always() && steps.check_reconciliation.outputs.status == 'FAIL'
             && steps.check_reconciliation.outputs.discrepancies != '0'
             && steps.verify_sync.outputs.resolved != 'true'
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 587
        username: ${{ secrets.EMAIL_USERNAME }}
        password: ${{ secrets.EMAIL_PASSWORD }}
        subject: "Trading · Manual sync needed (${{ steps.runtime_date.outputs.today }})"
        to: ${{ secrets.EMAIL_TO }}
        from: Trading System
        html_body: |
          <!DOCTYPE html><html><body style="margin:0;padding:0;background:#f5f5f0;
                font-family:-apple-system,'SF Pro Display','Helvetica Neue',Arial,sans-serif;
                color:#111;">
          <div style="max-width:560px;margin:0 auto;padding:32px 28px;">
            <div style="font-size:11px;font-weight:700;letter-spacing:0.22em;
                        color:#9a9a9a;text-transform:uppercase;margin-bottom:10px;">
              ${{ steps.runtime_date.outputs.today }} · Reconciliation
            </div>
            <div style="font-size:26px;font-weight:800;letter-spacing:-0.02em;
                        color:#111;line-height:1.2;margin-bottom:18px;">
              Auto-sync didn't fully resolve drift.
            </div>
            <div style="display:inline-block;background:#ffe1e1;border:1px solid #d63031;
                        color:#7a1a1a;font-size:11px;font-weight:800;letter-spacing:0.18em;
                        padding:5px 10px;border-radius:6px;margin-bottom:18px;">
              MANUAL ACTION SUGGESTED
            </div>
            <p style="font-size:14px;line-height:1.55;color:#333;margin:0 0 14px;">
              The trading run executed cleanly, but our local DB still differs from
              Alpaca after the automatic sync attempt.
              <strong>${{ steps.verify_sync.outputs.remaining }} discrepancy(ies)</strong>
              remain after auto-sync.
            </p>
            <div style="background:#fff;border:1px solid #e6e6e0;border-radius:14px;
                        padding:18px 20px;margin:18px 0;">
              <div style="font-size:10px;font-weight:700;letter-spacing:0.18em;
                          color:#9a9a9a;text-transform:uppercase;margin-bottom:10px;">
                What this usually means
              </div>
              <div style="font-size:13px;line-height:1.6;color:#333;">
                Most often a market-on-close fill from yesterday landed at Alpaca
                after our verification poll timed out, so the broker has a position
                we didn't record. Auto-sync normally patches it; when it doesn't,
                run the sync manually.
              </div>
            </div>
            <div style="background:#fff;border:1px solid #e6e6e0;border-radius:14px;
                        padding:18px 20px;margin:18px 0;">
              <div style="font-size:10px;font-weight:700;letter-spacing:0.18em;
                          color:#9a9a9a;text-transform:uppercase;margin-bottom:10px;">
                Fix in one command
              </div>
              <pre style="font-family:'SF Mono',Menlo,monospace;font-size:12px;
                          background:#f0f0eb;padding:10px 12px;border-radius:8px;
                          margin:0;color:#111;overflow:auto;">python3 scripts/sync_broker_state.py</pre>
              <div style="font-size:11px;color:#5e5e5e;margin-top:10px;">
                Or trigger the <em>Sync Database</em> workflow from the Actions tab.
              </div>
            </div>
            <p style="font-size:12px;color:#5e5e5e;margin:18px 0 6px;">
              Run #${{ github.run_number }} ·
              <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                 style="color:#76b900;text-decoration:none;">view logs</a>
            </p>
            <p style="font-size:11px;color:#9a9a9a;margin:0;">
              Trading itself is unaffected and will continue on the next run.
            </p>
          </div>
          </body></html>

    - name: Ping dead-man's switch
      if: always()
      continue-on-error: true
      run: |
        # Ping healthchecks.io so external monitoring knows the run completed.
        # Set HEALTHCHECKS_URL secret to your healthchecks.io check URL.
        # If the secret is absent, this is a no-op (continue-on-error: true handles it).
        if [ -n "${{ secrets.HEALTHCHECKS_URL }}" ]; then
          STATUS="0"
          if [ "${{ job.status }}" != "success" ]; then STATUS="1"; fi
          curl -fsS --retry 3 --max-time 10 \
            "${{ secrets.HEALTHCHECKS_URL }}/$STATUS" > /dev/null 2>&1 || true
        else
          echo "HEALTHCHECKS_URL not set — skipping dead-man's switch ping"
        fi

    - name: Send failure notification
      if: |
        always() &&
        steps.check_status.outputs.status != 'MARKET_CLOSED' &&
        (steps.check_status.outputs.status == 'PREFLIGHT_FAILED' ||
         steps.check_status.outputs.status == 'EXECUTION_FAILED' ||
         steps.final_gate.outcome == 'failure' ||
         steps.validate_email.outputs.email_ok != 'true')
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 587
        username: ${{ secrets.EMAIL_USERNAME }}
        password: ${{ secrets.EMAIL_PASSWORD }}
        subject: "${{ steps.run_health.outputs.recurring == 'true' && format('🔁 [RECURRING: {0}] ', steps.run_health.outputs.recurring_checks) || '' }}❌ Daily Trading Workflow Failed (UNEXPECTED) - ${{ steps.runtime_date.outputs.today }}"
        to: ${{ secrets.EMAIL_TO }}
        from: Trading System
        html_body: |
          <!DOCTYPE html><html><body style="margin:0;padding:0;background:#f5f5f0;
              font-family:-apple-system,'Helvetica Neue',Arial,sans-serif;color:#111;">
          <div style="max-width:520px;margin:0 auto;padding:32px 24px;">
            <div style="font-size:11px;font-weight:700;letter-spacing:0.2em;color:#9a9a9a;
                        text-transform:uppercase;margin-bottom:10px;">
              ${{ steps.runtime_date.outputs.today }} · Workflow Failure
            </div>
            <div style="font-size:24px;font-weight:800;letter-spacing:-0.02em;
                        color:#c0392b;line-height:1.25;margin-bottom:14px;">
              Daily trading workflow failed.
            </div>
            <div style="display:inline-block;background:#ffe1e1;border:1px solid #d63031;
                        color:#7a1a1a;font-size:11px;font-weight:700;letter-spacing:0.15em;
                        padding:4px 10px;border-radius:6px;margin-bottom:18px;">
              ACTION REQUIRED
            </div>
            <p style="font-size:14px;line-height:1.6;color:#333;margin:0 0 16px;">
              An unexpected error stopped the trading workflow. No orders may have been placed.
              Review the logs to determine the root cause.
            </p>
            <div style="background:#fff;border:1px solid #e0e0d8;border-radius:12px;
                        padding:14px 18px;margin-bottom:18px;">
              <table style="border-collapse:collapse;width:100%;font-size:13px;color:#333">
                <tr><td style="padding:4px 0;color:#888;width:90px">Run</td>
                    <td style="padding:4px 0">#${{ github.run_number }}</td></tr>
                <tr><td style="padding:4px 0;color:#888">Date</td>
                    <td style="padding:4px 0">${{ steps.runtime_date.outputs.today }}</td></tr>
                <tr><td style="padding:4px 0;color:#888">Workflow</td>
                    <td style="padding:4px 0">${{ github.workflow }}</td></tr>
                <tr><td style="padding:4px 0;color:#888">Status</td>
                    <td style="padding:4px 0;color:#c0392b;font-weight:600">
                      ${{ steps.check_status.outputs.status }}</td></tr>
              </table>
            </div>
            <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
               style="display:inline-block;background:#111;color:#fff;text-decoration:none;
                      font-size:13px;font-weight:600;padding:10px 20px;border-radius:8px;
                      margin-bottom:16px;">
              View Logs →
            </a>
            <p style="font-size:12px;color:#888;margin:12px 0 0">
              Artifacts (if any): daily-artifacts-${{ github.run_number }}
            </p>
          </div>
          </body></html>

    # Must be the LAST step: re-asserts the health gate's verdict as the job
    # status. The gate itself runs with continue-on-error so the failure email
    # above can still be sent after a gate failure.
    - name: Propagate health gate result
      if: always()
      run: |
        if [ "${{ steps.final_gate.outcome }}" = "failure" ]; then
          echo "❌ Job failed: final health gate did not pass"
          exit 1
        fi
        echo "✅ Run healthy"
