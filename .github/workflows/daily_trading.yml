name: Daily Trading Execution

on:
  schedule:
    # Runs at 1:15 PM PST (4:15 PM EST / 21:15 UTC) after market close, Monday-Friday
    - cron: '15 21 * * 1-5'
  workflow_dispatch:  # Allow manual trigger

env:
  PYTHON_VERSION: "3.8"

jobs:
  daily-execution:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Import check
      run: |
        python3 scripts/import_check.py
    
    - name: Download previous database (if exists)
      continue-on-error: true
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        echo "=== Downloading latest trading-database artifact ==="
        # List recent artifacts named trading-database, get the most recent one
        ARTIFACT_ID=$(gh api repos/${{ github.repository }}/actions/artifacts \
          --jq '.artifacts | map(select(.name == "trading-database" and .expired == false)) | sort_by(.created_at) | reverse | .[0].id // empty')
        
        if [ -n "$ARTIFACT_ID" ]; then
          echo "Found artifact ID: $ARTIFACT_ID"
          gh api repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID/zip > trading-db.zip
          unzip -o trading-db.zip
          rm -f trading-db.zip
          echo "✅ Downloaded trading.db from artifact $ARTIFACT_ID"
          ls -la trading.db
        else
          echo "⚠️ No trading-database artifact found — will initialize fresh"
        fi
    
    - name: Initialize database
      run: |
        python scripts/setup_database.py --db trading.db
    
    - name: Create required directories
      run: |
        mkdir -p artifacts/json artifacts/markdown artifacts/funnel artifacts/data_quality artifacts/drawdown artifacts/health logs data
    
    - name: Update market data
      env:
        ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
      run: |
        echo "=== Fetching Latest Market Data ==="
        python3 scripts/update_daily_data.py || echo "Data update completed with warnings"
    
    - name: Check signal generation health
      run: |
        echo "=== Signal Generation Health Check ==="
        python3 scripts/monitor_signal_health.py || echo "Health check completed with warnings"
    
    - name: Run trading with pre-flight checks
      env:
        ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
        ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
        ALPACA_PAPER: 'true'
        ALPACA_LIVE_ENABLED: 'false'
        DRY_RUN: 'false'
        ENABLE_BROKER_RECONCILIATION: 'true'
        DATA_VALIDATOR_MAX_AGE_HOURS: '288'
        TRADING_DISABLED: 'false'
      run: |
        chmod +x scripts/run_trading.sh
        ./scripts/run_trading.sh
    
    - name: Check if trading executed
      id: check_execution
      if: always()
      run: |
        if [ -f /tmp/run_status.txt ]; then
          STATUS=$(cat /tmp/run_status.txt)
          if [ "$STATUS" = "SUCCESS" ] || [ "$STATUS" = "EXECUTING" ]; then
            echo "executed=true" >> $GITHUB_OUTPUT
          else
            echo "executed=false" >> $GITHUB_OUTPUT
          fi
        else
          echo "executed=false" >> $GITHUB_OUTPUT
        fi
    
    - name: Check reconciliation status
      id: check_reconciliation
      if: always()
      continue-on-error: true
      run: |
        echo "=== Checking Reconciliation from Database ==="
        
        # Query database directly for reconciliation status
        RUN_ID=$(sqlite3 trading.db "SELECT run_id FROM broker_state ORDER BY created_at DESC LIMIT 1;" || echo "UNKNOWN")
        RECON_STATUS=$(sqlite3 trading.db "SELECT reconciliation_status FROM broker_state WHERE run_id='$RUN_ID' AND snapshot_type='RECONCILIATION';" || echo "UNKNOWN")
        
        echo "Run ID: $RUN_ID"
        echo "Reconciliation Status: $RECON_STATUS"
        
        # Set outputs for downstream steps
        echo "status=$RECON_STATUS" >> $GITHUB_OUTPUT
        
        if [ "$RECON_STATUS" = "FAIL" ]; then
          echo "discrepancies=1" >> $GITHUB_OUTPUT
          echo "⚠️  Reconciliation FAILED - will trigger auto-sync"
        else
          echo "discrepancies=0" >> $GITHUB_OUTPUT
          echo "✅ Reconciliation status: $RECON_STATUS"
        fi
        
        # Ensure outputs are set even on edge cases
        echo "recon_done=true" >> $GITHUB_OUTPUT
    
    - name: Auto-sync database on reconciliation failure
      id: auto_sync
      if: always() && steps.check_reconciliation.outputs.status == 'FAIL' && steps.check_reconciliation.outputs.discrepancies != '0'
      env:
        ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
        ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        ALPACA_PAPER: true
      run: |
        echo "🔄 Reconciliation failed - Auto-syncing database with broker..."
        python scripts/sync_broker_state.py
        echo "✅ Database auto-synced successfully"
        echo "synced=true" >> $GITHUB_OUTPUT
    
    - name: Re-upload synced database
      if: always() && steps.auto_sync.outputs.synced == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: trading-database
        path: trading.db
        retention-days: 90
        overwrite: true
    
    - name: Validate system invariants
      if: steps.check_execution.outputs.executed == 'true'
      continue-on-error: true
      run: |
        echo "=== Validating System ==="
        python3 scripts/validate_system.py --latest
    
    - name: Verify execution criteria
      if: steps.check_execution.outputs.executed == 'true'
      continue-on-error: true
      run: |
        echo "=== Verifying Execution ==="
        python3 scripts/verify_execution.py
    
    - name: Extract run metrics
      if: always()
      run: |
        echo "=== Run Metrics ==="
        RUN_ID=$(sqlite3 trading.db "SELECT run_id FROM broker_state ORDER BY created_at DESC LIMIT 1;" || echo "UNKNOWN")
        echo "Run ID: $RUN_ID"
        
        if [ "$RUN_ID" != "UNKNOWN" ]; then
          echo ""
          echo "Broker Snapshots:"
          sqlite3 trading.db "SELECT snapshot_type, reconciliation_status FROM broker_state WHERE run_id='$RUN_ID' ORDER BY created_at;"
          
          echo ""
          echo "Signal Termination:"
          sqlite3 trading.db "SELECT COUNT(*) AS total, SUM(CASE WHEN terminal_state IS NOT NULL THEN 1 ELSE 0 END) AS terminalized FROM signals WHERE run_id='$RUN_ID';"
          
          echo ""
          echo "Terminal States:"
          sqlite3 trading.db "SELECT terminal_state, terminal_reason, COUNT(*) FROM signals WHERE run_id='$RUN_ID' GROUP BY terminal_state, terminal_reason;"
          
          echo ""
          echo "Trades:"
          sqlite3 trading.db "SELECT COUNT(*) FROM trades WHERE run_id='$RUN_ID';"
        fi
    
    - name: Upload trading database
      if: always() && steps.auto_sync.outputs.synced != 'true'
      uses: actions/upload-artifact@v4
      with:
        name: trading-database
        path: trading.db
        retention-days: 90
        overwrite: true
    
    - name: Upload artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: daily-artifacts-${{ github.run_number }}
        path: |
          artifacts/
          logs/
        retention-days: 90
    
    - name: Generate strategy performance report
      if: success()
      run: |
        python3 scripts/generate_strategy_performance.py --days 30
    
    - name: Generate strategy performance chart
      if: success()
      run: |
        python3 scripts/generate_strategy_chart.py --days 7
    
    - name: Generate performance chart
      if: success()
      run: |
        python3 scripts/generate_email_chart.py
    
    - name: Generate daily email digest
      if: always()
      run: |
        # Check if today is Mon/Wed/Fri for visual reports
        DAY_OF_WEEK=$(date +%u)  # 1=Mon, 3=Wed, 5=Fri
        if [ "$DAY_OF_WEEK" = "1" ] || [ "$DAY_OF_WEEK" = "3" ] || [ "$DAY_OF_WEEK" = "5" ]; then
          echo "📊 Generating email with strategy performance visuals (Mon/Wed/Fri)"
          python3 scripts/generate_daily_email.py --include-visuals || python3 scripts/generate_daily_email.py
        else
          echo "📧 Generating standard daily email"
          python3 scripts/generate_daily_email.py
        fi
        # Fallback: ensure email HTML exists so the send step never crashes on a missing file
        if [ ! -f /tmp/daily_email.html ]; then
          echo "Email generation failed — writing minimal fallback HTML"
          python3 -c "import datetime; open('/tmp/daily_email.html','w').write('<html><body style=\"font-family:sans-serif;padding:24px\"><h2>Daily Trading Digest &mdash; generation failed</h2><p>Email generation script failed. Check workflow logs.</p><p>Date: '+datetime.date.today().isoformat()+'</p></body></html>')"
        fi
    
    - name: Send daily digest email
      if: always()
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 587
        username: ${{ secrets.EMAIL_USERNAME }}
        password: ${{ secrets.EMAIL_PASSWORD }}
        subject: "📊 Daily Trading Digest - ${{ github.run_number }}"
        to: ${{ secrets.EMAIL_TO }}
        from: Trading System
        html_body: file:///tmp/daily_email.html
    
    - name: Create GitHub summary
      if: always()
      run: |
        RUN_ID=$(sqlite3 trading.db "SELECT run_id FROM broker_state ORDER BY created_at DESC LIMIT 1;" || echo "UNKNOWN")
        SIGNALS=$(sqlite3 trading.db "SELECT COUNT(*) FROM signals WHERE run_id='$RUN_ID';" || echo "0")
        TRADES=$(sqlite3 trading.db "SELECT COUNT(*) FROM trades WHERE run_id='$RUN_ID';" || echo "0")
        RECON_STATUS=$(sqlite3 trading.db "SELECT reconciliation_status FROM broker_state WHERE run_id='$RUN_ID' AND snapshot_type='RECONCILIATION';" || echo "UNKNOWN")
        
        cat > $GITHUB_STEP_SUMMARY << EOF
        # Daily Trading Execution - $(date +%Y-%m-%d)
        
        **Run ID:** \`$RUN_ID\`  
        **Signals:** $SIGNALS  
        **Trades:** $TRADES  
        **Reconciliation:** $RECON_STATUS  
        **Status:** ${{ job.status }}
        
        ## Validation Checks
        - ✅ Safety: Paper trading mode verified
        - ✅ System Invariants: Validated
        - ✅ Execution Criteria: Verified
        - ✅ Database: Uploaded (90 day retention)
        - ✅ Artifacts: Uploaded (90 day retention)
        
        ## Environment
        - ALPACA_PAPER: true
        - PHASE5_SIGNAL_INJECTION: false
        - ENABLE_BROKER_RECONCILIATION: true
        - DATA_MAX_AGE_HOURS: 72
        
        ## Artifacts
        - Database: \`trading-database\`
        - Daily artifacts: \`daily-artifacts-${{ github.run_number }}\`
        EOF
    
    - name: Check run status
      id: check_status
      if: always()
      run: |
        if [ -f /tmp/run_status.txt ]; then
          STATUS=$(cat /tmp/run_status.txt)
          echo "status=$STATUS" >> $GITHUB_OUTPUT
        else
          echo "status=UNKNOWN" >> $GITHUB_OUTPUT
        fi
    
    - name: Send market closed notification
      if: always() && steps.check_status.outputs.status == 'MARKET_CLOSED'
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 587
        username: ${{ secrets.EMAIL_USERNAME }}
        password: ${{ secrets.EMAIL_PASSWORD }}
        subject: "⏸️ Trading Skipped - Market Closed (Expected) - ${{ github.run_number }}"
        to: ${{ secrets.EMAIL_TO }}
        from: Trading System
        body: |
          Trading Run Skipped - Market Closed (Expected)
          
          Run: ${{ github.run_number }}
          Date: $(date +%Y-%m-%d)
          Status: Market closed (weekend or holiday)
          
          This is expected behavior. The trading system automatically skips execution when:
          - Market is closed (weekends)
          - Market holidays
          
          No action required. The system will resume automatically on the next trading day.
          
          Next scheduled run: Monday-Friday at 4:15 PM ET
    
    - name: Send reconciliation warning
      if: always() && steps.check_reconciliation.outputs.status == 'FAIL' && steps.check_reconciliation.outputs.discrepancies != '0'
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 587
        username: ${{ secrets.EMAIL_USERNAME }}
        password: ${{ secrets.EMAIL_PASSWORD }}
        subject: "⚠️ Trading Reconciliation Warning - ${{ github.run_number }}"
        to: ${{ secrets.EMAIL_TO }}
        from: Trading System
        body: |
          Trading Execution Completed - Reconciliation Discrepancies Detected
          
          Run: ${{ github.run_number }}
          Date: $(date +%Y-%m-%d)
          Status: Execution successful, reconciliation has ${{ steps.check_reconciliation.outputs.discrepancies }} discrepancies
          
          The trading system executed successfully, but found differences between:
          - System's internal state (what it thinks it owns)
          - Broker's actual state (what Alpaca reports)
          
          This is common in paper trading and usually not a concern. Review the artifacts to see details.
          
          Artifacts available:
          - Database: trading-database
          - Daily artifacts: daily-artifacts-${{ github.run_number }}
          
          View run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    
    - name: Send failure notification
      if: failure() && steps.check_status.outputs.status != 'MARKET_CLOSED'
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 587
        username: ${{ secrets.EMAIL_USERNAME }}
        password: ${{ secrets.EMAIL_PASSWORD }}
        subject: "❌ Daily Trading Workflow Failed (UNEXPECTED) - ${{ github.run_number }}"
        to: ${{ secrets.EMAIL_TO }}
        from: Trading System
        body: |
          ⚠️ UNEXPECTED FAILURE - Daily Trading Execution Failed
          
          Run: ${{ github.run_number }}
          Date: ${{ github.event.repository.updated_at }}
          Workflow: ${{ github.workflow }}
          Status: ${{ steps.check_status.outputs.status }}
          
          This is an UNEXPECTED failure that requires attention.
          
          Failed Step: Check the logs at:
          https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          
          Please review the failure and take corrective action.
          
          Artifacts (if any): daily-artifacts-${{ github.run_number }}
