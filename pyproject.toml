[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "investor-mimic-bot"
version = "1.0.0"
description = "Industrial-grade quantitative trading system with regime-aware risk management"
readme = "README.md"
requires-python = ">=3.8,<3.12"
license = {text = "MIT"}
authors = [
    {name = "Shreyas Chickerur", email = "shreyas@example.com"}
]
keywords = ["trading", "quantitative", "algorithmic", "finance", "risk-management"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Office/Business :: Financial :: Investment",
]

dependencies = [
    "alpaca-py>=0.11.0",
    "pandas>=2.0.0,<3.0.0",
    "numpy>=1.24.0,<2.0.0",
    "scikit-learn>=1.3.0,<2.0.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "streamlit>=1.29.0",
    "plotly>=5.18.0",
    "pydantic>=2.0.0,<3.0.0",
    "pydantic-settings>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "pre-commit>=3.5.0",
    "ipython>=8.12.0",
]
security = [
    "safety>=2.3.0",
    "bandit>=1.7.0",
]
monitoring = [
    "prometheus-client>=0.19.0",
    "sentry-sdk>=1.40.0",
]

[project.urls]
Homepage = "https://github.com/shreyas-chickerur/investor-mimic-bot"
Repository = "https://github.com/shreyas-chickerur/investor-mimic-bot"
Issues = "https://github.com/shreyas-chickerur/investor-mimic-bot/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py38"
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "C",  # flake8-comprehensions
    "B",  # flake8-bugbear
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]
# Pre-existing violations in large files — suppressed to avoid scope creep in unrelated PRs
"src/core/database.py" = ["UP007", "F811"]
"src/core/execution_engine.py" = ["E402", "E722", "F841"]
"scripts/generate_daily_email.py" = ["F841"]
"src/strategies/strategy_factor_momentum.py" = ["E402"]
"src/strategies/strategy_rsi_mean_reversion.py" = ["E402"]
"src/strategies/strategy_ml_momentum.py" = ["E402"]
"src/strategies/strategy_earnings_drift.py" = ["E402"]
"src/strategies/strategy_ma_crossover.py" = ["E402", "C416"]
"src/strategies/strategy_news_sentiment.py" = ["E402", "C416"]
"src/strategies/strategy_volatility_breakout.py" = ["E402", "C416"]
"src/integration/portfolio_backtester.py" = ["E402"]
"scripts/*.py" = ["E402"]
"tests/*.py" = ["E402"]
"tests/**/*.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = [
    "tests/",
    "dashboard/",
    "scripts/generate_daily_email\\.py",
    "src/core/database\\.py",
    "src/core/execution_engine\\.py",
    "src/integration/portfolio_backtester\\.py",
    "src/strategies/strategy_rsi_mean_reversion\\.py",
    "src/strategies/strategy_factor_momentum\\.py",
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --tb=short"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "component: Component tests",
    "functional: Functional tests",
    "slow: Slow running tests",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/dashboard/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.bandit]
exclude_dirs = ["tests", "scripts"]
skips = ["B101", "B601"]
