# Trading System Configuration
# All hardcoded parameters centralized here

# Risk Management
risk:
  # Portfolio-level risk limits
  max_portfolio_heat: 0.40  # Maximum 40% of portfolio in positions at any time
  max_daily_loss_pct: 0.05  # Maximum 5% daily loss before halt
  max_position_size_pct: 0.10  # Maximum 10% per position
  max_total_positions: 12       # Hard cap on total open positions across all strategies
  min_cash_allocation_pct: 0.20  # Minimum 20% per-strategy cash buffer
  dynamic_max_allocation_pct: 0.50  # Max strategy allocation (dynamic allocator)
  dynamic_min_allocation_pct: 0.05  # Min strategy allocation (dynamic allocator)

  # Drawdown stops
  drawdown_halt_threshold: 0.10  # 10% drawdown triggers halt
  drawdown_panic_threshold: 0.15  # 15% drawdown triggers panic
  halt_cooldown_days: 10
  panic_cooldown_days: 20
  rampup_days: 5
  rampup_sizing_pct: 0.50  # 50% sizing during rampup
  flatten_on_panic: true

  # Stop losses (adaptive by volatility regime)
  stop_loss_atr_multiplier: 2.5  # Default / normal-vol multiplier
  stop_loss_atr_multiplier_low_vol: 3.0  # Wider in low vol — avoid noise stop-outs in chop
  stop_loss_atr_multiplier_high_vol: 2.0  # Tighter in high vol — protect against fast moves
  trailing_stop_atr_multiplier: 3.0  # 3x ATR for trailing stop (legacy)
  # Ratchet trailing: lock in profits as winners run
  trailing_breakeven_atr: 1.0  # +1×ATR open profit → ratchet stop to entry
  trailing_lock_atr: 2.0       # +2×ATR open profit → ratchet stop to entry +1×ATR

  # Sector concentration limit
  max_sector_pct: 0.30  # No single sector may exceed 30% of portfolio

  # Per-symbol concentration cap (cross-portfolio, all strategies combined)
  max_single_symbol_pct: 0.15  # No single symbol may exceed 15% of total portfolio value

  # Overnight exposure cap — total OPG-queued + open position value as % of portfolio
  max_overnight_exposure_pct: 0.85  # At most 85% of portfolio value held or queued overnight

  # Per-strategy loss limit
  max_strategy_loss_pct: 0.20  # 20% loss from initial capital triggers strategy freeze

  # Correlation filter
  correlation_window: 60  # 60-day rolling correlation
  correlation_short_window: 20  # 20-day short window for regime shifts
  max_correlation: 0.80  # Reject if correlation > 0.8 (relaxed from 0.7)

# Position Sizing
position_sizing:
  base_risk_per_trade: 0.01  # 1% portfolio risk per trade
  atr_period: 14  # 14-day ATR for volatility
  min_position_value: 100  # Minimum $100 position
  max_position_value: 50000  # Maximum $50k position

# Execution
execution:
  execution_time: "16:15"  # 4:15 PM ET (15 min before close)
  timezone: "America/New_York"

  # Execution costs
  commission_per_share: 0.0  # $0 commission (Alpaca)
  slippage_bps: 5  # 5 basis points slippage
  market_impact_threshold: 0.01  # 1% of daily volume

  # Order management
  order_timeout_seconds: 300  # 5 minute timeout
  max_retries: 3

# Regime Detection
regime:
  # VIX thresholds
  vix_low_threshold: 15  # Low volatility regime
  vix_high_threshold: 25  # High volatility regime
  vix_crisis_threshold: 35  # Crisis regime

  # Trend detection
  trend_lookback_days: 60  # 60-day trend
  trend_ma_short: 20  # 20-day MA
  trend_ma_long: 50  # 50-day MA

  # Regime-based adjustments
  high_vol_heat_reduction: 0.20  # Reduce heat by 20% in high vol
  crisis_heat_reduction: 0.50  # Reduce heat by 50% in crisis

# Strategy Allocation
strategies:
  # Dynamic allocation
  enable_dynamic_allocation: true
  rebalance_frequency_days: 30  # Rebalance every 30 days
  min_allocation_pct: 0.05   # Minimum 5% per strategy
  max_allocation_pct: 0.35   # Default maximum 35% per strategy
  # Equal capital normalization: fraction of portfolio deployed across strategies
  # Reserves 15% as unallocated buffer; each active strategy gets an equal share
  deployed_capital_pct: 0.85

  # Backtest Sharpe priors — seed allocator when live history < 20 days
  # RSI Sharpe 0.65 (p=0.019), Earnings Drift estimated 0.80 (p=0.001),
  # ML Momentum 0.30 (edge only at high conf), Factor Momentum 0.0 (no edge)
  backtest_sharpe_priors:
    rsi_mean_reversion: 0.65
    earnings_drift: 0.80
    ml_momentum: 0.30
    factor_momentum: 0.25
    news_sentiment: 0.25
    ma_crossover: 0.20
    volatility_breakout: 0.20

  # Per-strategy allocation caps (override global max_allocation_pct)
  allocation_overrides:
    rsi_mean_reversion: 0.25   # Capped down from 0.40 — prior Sharpe doesn't warrant 40%
    earnings_drift: 0.25       # Capped down from 0.35 — still highest-prior strategy
    ml_momentum: 0.20          # Edge at high-conf only — cap at 20%
    factor_momentum: 0.15      # Re-enabled; live P&L positive but limited sample
    news_sentiment: 0.15       # Unvalidated — moderate cap
    ma_crossover: 0.15         # Unvalidated — moderate cap
    volatility_breakout: 0.15  # Unvalidated — moderate cap

  # Strategy-specific parameters
  rsi_mean_reversion:
    rsi_period: 14
    rsi_oversold: 30
    rsi_overbought: 70
    rsi_slope_threshold: 5
    vwap_proximity_pct: 0.02

  ma_crossover:
    fast_ma: 20
    slow_ma: 50
    volume_confirmation: true
    volume_min_ratio: 0.3      # Liquidity floor only — not a momentum filter
    cross_lookback: 5          # Accept golden cross within last 5 trading days

  news_sentiment:
    buy_threshold: 0.60    # Lowered from 0.68; VADER compound >0.36 was rarely met
    sell_threshold: 0.38
    hold_days: 7
    max_hold_days: 14

  ml_momentum:
    lookback_days: 60
    min_confidence: 0.65
    feature_count: 12
    max_new_positions_per_day: 2
    buy_quantile_threshold: 0.70
    # Time-exit gating. The strategy used to dump positions at day 5
    # regardless of P&L, producing synchronized losing exits (AMD -$279
    # on 2026-05-18). Now: exit at hold_days only if profitable OR the
    # model's probability has fallen below time_exit_bearish_threshold;
    # max_hold_days is the absolute ceiling.
    hold_days: 5
    max_hold_days: 15
    time_exit_bearish_threshold: 0.50

  factor_momentum:
    disabled: false  # Re-enabled: live P&L +$714, 50% win rate (2 closed trades)
    top_n: 3

  earnings_drift:
    volume_spike_threshold: 1.3
    calendar_entry_window_days: 5
    drift_hold_days: 40
    profit_target_pct: 0.20
    stop_loss_pct: 0.10
    min_surprise_return: 0.02

  volatility_breakout:
    atr_period: 14
    breakout_multiplier: 2.0
    volume_spike_min: 1.2      # Lowered from 1.5 — max universe vol today was 1.46

# Data Management
data:
  # Data sources
  primary_source: "alpaca"  # alpaca or alpha_vantage
  backup_source: "alpha_vantage"

  # Data quality
  min_data_points: 100  # Minimum data points required
  max_missing_pct: 0.05  # Maximum 5% missing data
  outlier_std_threshold: 5  # 5 standard deviations

  # Universe
  universe_size: 36  # Number of stocks in universe
  rebalance_universe_days: 90  # Rebalance universe every 90 days

# Monitoring
monitoring:
  # Performance tracking
  track_sharpe: true
  track_sortino: true
  track_calmar: true
  rolling_window_days: 252  # 1 year rolling metrics

  # Alerts
  enable_email_alerts: true
  alert_on_drawdown: true
  alert_on_daily_loss: true
  alert_on_reconciliation_fail: true

  # Artifact generation
  save_daily_artifacts: true
  artifact_retention_days: 365

# Backtesting
backtesting:
  # Walk-forward parameters
  training_period_years: 2
  test_period_months: 6
  step_size_months: 6

  # Validation
  min_sharpe: 0.5  # Minimum acceptable Sharpe
  max_drawdown: 0.25  # Maximum acceptable drawdown
  min_trades: 30  # Minimum trades for valid backtest

# Paper Trading
paper_trading:
  min_duration_days: 14  # Minimum 2 weeks
  log_all_signals: true
  log_rejected_signals: true

# Database
database:
  path: "trading.db"
  backup_frequency_days: 7
  vacuum_frequency_days: 30
