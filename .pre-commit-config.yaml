# Pre-commit hooks for code quality and consistency
# Install: pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]  # Allow custom tags in GitHub Actions
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: ['--maxkb=1000']
        # The committed market-data snapshot (1.5MB xz) feeds the CI
        # functional suite / DRY_RUN canary; everything else stays <1MB.
        exclude: ^tests/fixtures/market_data_snapshot\.csv\.xz$
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-docstring-first
      - id: debug-statements
      - id: name-tests-test
        args: [--pytest-test-first]

  # Python code formatting with Black
  - repo: https://github.com/psf/black
    rev: 23.12.1
    hooks:
      - id: black
        language_version: python3.11
        args: [--line-length=100]

  # Python linting with Ruff (replaces flake8, isort, pyupgrade)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.1.9
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]

  # Type checking with mypy
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.7.1
    hooks:
      - id: mypy
        additional_dependencies: [types-requests, types-PyYAML]
        # follow-imports=silent: type-check the staged file but don't surface
        # pre-existing errors in transitively imported modules.
        # database.py and execution_engine.py have large pre-existing type backlogs
        # that are excluded here to avoid unrelated PR noise.
        args: [
          --ignore-missing-imports,
          --python-version=3.11,
          --follow-imports=silent,
        ]
        exclude: ^(tests/|dashboard/|src/core/database\.py|src/core/execution_engine\.py|src/data/vix_data_fetcher\.py|src/integration/portfolio_backtester\.py|src/strategies/strategy_rsi_mean_reversion\.py|src/strategies/strategy_factor_momentum\.py|src/regime/regime_detector\.py|scripts/generate_platform_status\.py|scripts/run_backtest\.py|scripts/export_snapshot\.py|scripts/validate_snapshot\.py)

  # Security checks
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.6
    hooks:
      - id: bandit
        args: [-c, pyproject.toml]
        additional_dependencies: ["bandit[toml]"]
        exclude: ^(tests/|src/core/database\.py|src/core/execution_engine\.py|src/integration/portfolio_backtester\.py)

  # Dependency security scanning — informational; does not block commits.
  # Results are visible in pre-commit output and CI logs. Address CVEs
  # proactively but don't gate every commit on a moving security database.
  - repo: https://github.com/Lucas-C/pre-commit-hooks-safety
    rev: v1.3.3
    hooks:
      - id: python-safety-dependencies-check
        files: requirements.txt
        verbose: true
        args: [--continue-on-error]

  # Markdown linting
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.38.0
    hooks:
      - id: markdownlint
        args: [--fix]

  # YAML linting
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.33.0
    hooks:
      - id: yamllint
        args: [-c=.yamllint.yml]

  # Commit message linting
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v3.13.0
    hooks:
      - id: commitizen
        stages: [commit-msg]

  # Secrets detection
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.4.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: package.lock.json
