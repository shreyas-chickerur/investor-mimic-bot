[pytest]
addopts = -v --tb=short --no-header -m "not slow"
testpaths = tests/unit tests/component
timeout = 30
log_level = WARNING
log_file = logs/pytest_run.log
log_file_level = DEBUG
log_cli = false
markers =
    slow: tests that load real data files or are computationally expensive (run with: pytest -m slow)
    unit: fast isolated unit tests
    component: component-level tests with light integration
